name: onemate

services:
  frontend:
    build:
      context: ./client
      args:
        VITE_OPENWEATHER_API_KEY: ${VITE_OPENWEATHER_API_KEY}
        VITE_IPINFO_API_KEY: ${VITE_IPINFO_API_KEY}
        VITE_MYMEMORY_API_KEY: ${VITE_MYMEMORY_API_KEY}
    image: onemate-frontend:latest
    container_name: onemate-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend-nginx

  backend:
    build:
      context: ./server
    image: onemate-backend:latest
    container_name: onemate-backend
    restart: unless-stopped
    env_file:
      - ./.env.production
    volumes:
      - backend_public:/var/www/html/public
    depends_on:
      postgres:
        condition: service_healthy

  backend-nginx:
    image: nginx:1.27-alpine
    container_name: onemate-backend-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - backend_public:/var/www/html/public:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: onemate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - onemate_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue:
    image: onemate-backend:latest
    container_name: onemate-queue
    restart: unless-stopped
    env_file:
      - ./.env.production
    command: php artisan queue:work --tries=3 --timeout=40
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy

  scheduler:
    image: onemate-backend:latest
    container_name: onemate-scheduler
    restart: unless-stopped
    env_file:
      - ./.env.production
    command: php artisan schedule:work
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  onemate_pgdata:
  backend_public:
